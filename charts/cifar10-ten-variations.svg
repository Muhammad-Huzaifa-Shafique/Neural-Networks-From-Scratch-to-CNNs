<text x="622.7" y="124" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="600" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">74.54%  best</text>
<text x="608.8" y="152" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">71.75%</text>
<text x="608.2" y="180" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">71.65%</text>
<text x="606.2" y="208" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">71.23%</text>
<text x="599.4" y="236" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">69.87%</text>
<text x="597.5" y="264" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">69.50%</text>
<text x="591.6" y="292" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68.32%</text>
<text x="591.2" y="320" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68.23%</text>
<text x="590.1" y="348" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68.03%</text>
<text x="549.8" y="376" font-size="12" fill="#e8edf6" text-anchor="start" font-weight="400" stroke="#0e1320" stroke-width="5" stroke-linejoin="round" paint-order="stroke">59.96%</text>

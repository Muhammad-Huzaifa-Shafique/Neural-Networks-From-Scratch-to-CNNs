<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" width="720" height="432" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Assignment 4: test accuracy for ten CIFAR-10 variations</title>
<desc id="d">Bar chart of test accuracy, higher is better. Base model 71.65 percent. The deeper network with three convolutional layers scored 74.54 percent, the best. The lower learning rate scored 59.96 percent, the lowest.</desc>
<rect x="0.5" y="0.5" width="719" height="431" rx="12" fill="#0e1320" stroke="#222b40"/>
<text x="28" y="36" font-size="15" fill="#e8edf6" text-anchor="start" font-weight="600">CIFAR-10: test accuracy for the ten CNN variations</text>
<text x="28" y="56" font-size="12" fill="#a7b1c6" text-anchor="start" font-weight="400">Higher is better. One training run per variation, 10 epochs unless noted.</text>
<rect x="28" y="76" width="12" height="12" rx="2" fill="#338ced"/>
<text x="46" y="86" font-size="12" fill="#a7b1c6" text-anchor="start" font-weight="400">Best variation</text>
<rect x="162" y="76" width="12" height="12" rx="2" fill="#6f7b92"/>
<text x="180" y="86" font-size="12" fill="#a7b1c6" text-anchor="start" font-weight="400">Other variations</text>
<line x1="310" x2="328" y1="82" y2="82" stroke="#a7b1c6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="334" y="86" font-size="12" fill="#a7b1c6" text-anchor="start" font-weight="400">Base model, 71.65%</text>
<line x1="242.0" x2="242.0" y1="108" y2="386" stroke="#232c42" stroke-width="1"/>
<text x="242.0" y="402" font-size="11" fill="#a7b1c6" text-anchor="middle" font-weight="400">0%</text>
<line x1="342.0" x2="342.0" y1="108" y2="386" stroke="#232c42" stroke-width="1"/>
<text x="342.0" y="402" font-size="11" fill="#a7b1c6" text-anchor="middle" font-weight="400">20%</text>
<line x1="442.0" x2="442.0" y1="108" y2="386" stroke="#232c42" stroke-width="1"/>
<text x="442.0" y="402" font-size="11" fill="#a7b1c6" text-anchor="middle" font-weight="400">40%</text>
<line x1="542.0" x2="542.0" y1="108" y2="386" stroke="#232c42" stroke-width="1"/>
<text x="542.0" y="402" font-size="11" fill="#a7b1c6" text-anchor="middle" font-weight="400">60%</text>
<text x="232" y="124" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="600">Deeper network</text>
<path d="M242,112 h369.7 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-369.7 z" fill="#338ced"/>
<text x="232" y="152" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="400">Wider network</text>
<path d="M242,140 h355.8 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-355.8 z" fill="#6f7b92"/>
<text x="232" y="180" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="400">Base model</text>
<path d="M242,168 h355.2 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-355.2 z" fill="#6f7b92"/>
<text x="232" y="208" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="400">LeakyReLU activation</text>
<path d="M242,196 h353.2 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-353.2 z" fill="#6f7b92"/>
<text x="232" y="236" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="400">More epochs</text>
<path d="M242,224 h346.4 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-346.4 z" fill="#6f7b92"/>
<text x="232" y="264" font-size="12" fill="#e8edf6" text-anchor="end" font-weight="400">Data augmentation</text>

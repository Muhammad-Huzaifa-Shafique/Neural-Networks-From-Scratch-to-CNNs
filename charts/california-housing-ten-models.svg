<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" width="720" height="432" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Assignment 3: test MAPE for ten California housing models</title>
<desc id="d">Bar chart of test MAPE, lower is better. Base model 21.33 percent. Kept changes: wider and deeper network 19.25, more epochs with early stopping 18.91 (best). Reverted changes range from 19.48 to 22.00.</desc>
